name: Capture v1.0.0 release screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.0.0
    paths:
      - "src/**"
      - "app.config.json"
      - "scripts/capture-release-screenshots.mjs"
      - ".github/workflows/capture-release-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build standalone HTML
        shell: pwsh
        run: ./build-standalone.ps1

      - name: Capture release screenshots
        shell: pwsh
        run: node ./scripts/capture-release-screenshots.mjs

      - name: Upload release screenshots
        uses: actions/upload-artifact@v7
        with:
          name: mini-league-desk-v1-release-screenshots-${{ github.sha }}
          path: release-screenshots/*.png
          if-no-files-found: error
          retention-days: 2

      - name: Commit release screenshots and remove capture helper
        shell: pwsh
        run: |
          Copy-Item -Force release-screenshots/screenshot.png assets/screenshot.png
          Copy-Item -Force release-screenshots/screenshot-mobile.png assets/screenshot-mobile.png
          Copy-Item -Force release-screenshots/screenshot-en.png assets/screenshot-en.png
          Copy-Item -Force release-screenshots/screenshot-mobile-en.png assets/screenshot-mobile-en.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/screenshot.png assets/screenshot-mobile.png assets/screenshot-en.png assets/screenshot-mobile-en.png
          git rm scripts/capture-release-screenshots.mjs .github/workflows/capture-release-screenshots.yml
          git commit -m "assets: refresh v1.0.0 release screenshots"
          git push origin "HEAD:release/v1.0.0"
